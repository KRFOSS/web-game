<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3eee5">
  <title>시점의 길 | 생각의 놀이터</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .arcade-back {
      position: fixed;
      z-index: 30;
      left: 22px;
      bottom: 22px;
      padding: 12px 16px;
      border-radius: 999px;
      background: rgba(20, 20, 20, .92);
      color: #fff;
      text-decoration: none;
      font: 700 13px/1 system-ui, sans-serif;
      box-shadow: 0 8px 24px rgba(0,0,0,.14);
    }
  </style>
</head>
<body>
  <main id="app">
    <canvas id="game" aria-label="3차원 원근 착시 퍼즐 게임"></canvas>

    <header class="hud">
      <div class="brand">
        <span class="eyebrow">PERSPECTIVE PUZZLE</span>
        <h1>시점의 길</h1>
      </div>
      <div class="stage-box">
        <span>단계</span>
        <strong id="stageLabel">1 / 5</strong>
      </div>
    </header>

    <section class="hint" id="hint" aria-live="polite">
      화면을 돌려 실제 3차원 경사로가 하나의 직선처럼 보이는 시점을 찾으세요.
    </section>

    <div class="status" id="status">통로의 굴곡이 사라지는 시점을 찾으세요.</div>

    <div class="controls">
      <button id="resetButton" type="button">현재 단계 다시 시작</button>
    </div>

    <a class="arcade-back" href="./">생각의 놀이터로 돌아가기</a>

    <div class="completion" id="completion" hidden>
      <div class="completion-card">
        <p class="eyebrow">COMPLETE</p>
        <h2>모든 시점을 찾았습니다.</h2>
        <p>길은 처음부터 끝까지 실제로 연결되어 있었고, 시점이 그 깊이를 감췄습니다.</p>
        <button id="againButton" type="button">처음부터 다시 하기</button>
      </div>
    </div>
  </main>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",
      "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
    }
  }
  </script>
  <script type="module" src="game.js"></script>
</body>
</html>
